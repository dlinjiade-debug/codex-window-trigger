name: Codex window sentinel
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'poll, initialize baseline only, or approved one-time canary'
        type: choice
        options: [poll, baseline, canary]
        default: poll
      dry_run:
        description: 'Read/validate only; never change Git, PRs, or stored state'
        type: boolean
        default: true
      canary_approved:
        description: 'User approved THIS canary now; may consume Codex usage/credits'
        type: boolean
        default: false
concurrency:
  group: codex-window-sentinel
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  poll:
    if: vars.SENTINEL_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate, plan, and publish under independent gates
        env:
          GH_TOKEN: ${{ github.token }}
          SENTINEL_ENABLED: ${{ vars.SENTINEL_ENABLED }}
          SENTINEL_OPERATION: ${{ inputs.operation }}
          SENTINEL_DRY_RUN: ${{ inputs.dry_run }}
          SENTINEL_CANARY_APPROVED: ${{ inputs.canary_approved }}
        run: python -m scripts.publish
